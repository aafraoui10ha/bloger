# Builds Toolbox Desktop for Windows x64 (MSI + NSIS installers) on a GitHub-hosted
# Windows runner. Nothing is published: installers are uploaded as workflow artifacts
# for testing. Unsigned until a code-signing certificate and updater keys are added
# (later phases); the website URL comes from repository variables, never from code.
name: Desktop (Windows)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel recorded in the build
        type: choice
        options: [stable, beta]
        default: stable
  push:
    branches: ["desktop/**"]
    paths:
      - "desktop/**"
      - "src-tauri/**"
      - "src/tools/**"
      - "src/app/globals.css"
      - "src/components/icons.tsx"
      - "messages/**"
      - "prisma/seed-data/**"
      - "public/fonts/designer/**"
      - "scripts/desktop/**"
      - "tests/desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      # Optional repository variables (Settings → Secrets and variables → Actions → Variables).
      TOOLBOX_SITE_URL: ${{ vars.TOOLBOX_SITE_URL }}
      TOOLBOX_DOWNLOAD_BASE_URL: ${{ vars.TOOLBOX_DOWNLOAD_BASE_URL }}
      TOOLBOX_UPDATE_ENDPOINT: ${{ vars.TOOLBOX_UPDATE_ENDPOINT }}
      TOOLBOX_CHANNEL: ${{ inputs.channel || 'stable' }}
      # prisma.config.ts requires a value for `prisma generate` (npm postinstall); no database is used.
      DATABASE_URL: mysql://ci:ci@localhost:3306/unused
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build metadata
        run: |
          echo "TOOLBOX_BUILD_ID=$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "TOOLBOX_RELEASE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "TOOLBOX_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency
        run: node scripts/desktop/version.mjs check

      - name: Check the desktop tool catalog is current
        run: npx tsx scripts/desktop/catalog.ts --check

      - name: Type check and lint
        run: |
          npx tsc --noEmit
          npx eslint desktop scripts/desktop tests/desktop src/tools

      - name: Unit tests
        run: npx vitest run --project unit

      - name: Build desktop frontend (static export)
        run: npm run desktop:frontend

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Desktop frontend tests (Chromium, app CSP)
        run: |
          npx playwright install chromium
          npx playwright test -c playwright.desktop.config.ts

      - name: Build installers (MSI + NSIS)
        run: npm run desktop:build

      - name: Collect installers and checksums
        run: |
          mkdir -p dist-desktop
          cp src-tauri/target/release/bundle/msi/*.msi dist-desktop/
          cp src-tauri/target/release/bundle/nsis/*.exe dist-desktop/
          cd dist-desktop
          sha256sum *.msi *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-desktop-${{ env.TOOLBOX_VERSION }}-windows-x64-build-${{ github.run_number }}
          path: dist-desktop/
          retention-days: 30
          if-no-files-found: error

      - name: Upload Cargo.lock (commit it for reproducible builds)
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ github.run_number }}
          path: src-tauri/Cargo.lock
          retention-days: 30
